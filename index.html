
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Disease Prediction</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 35px auto;
      padding: 20px;
      background: #f4f7fb;
      color: #1f2937;
    }
    h1 { color: #1456a0; }
    .notice {
      padding: 12px;
      background: #fff4d6;
      border-radius: 8px;
      font-size: 14px;
    }
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }
    label { display: block; font-weight: bold; }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      margin-top: 7px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    button {
      background: #1456a0;
      color: white;
      font-weight: bold;
      cursor: pointer;
      grid-column: 1 / -1;
    }
    #result {
      margin-top: 20px;
      padding: 16px;
      background: white;
      border-radius: 10px;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <h1>Heart Disease Prediction</h1>
  <p>Educational machine learning project</p>

  <div class="notice">
    This website is a demonstration only. It does not diagnose heart
    disease or replace advice from a qualified healthcare professional.
  </div>

  <h2>Patient Information</h2>

  <form id="predictionForm">
    <label>Age
      <input name="age" type="number" min="1" max="120" value="50" required>
    </label>

    <label>Sex
      <select name="sex">
        <option value="0">Female (0)</option>
        <option value="1" selected>Male (1)</option>
      </select>
    </label>

    <label>Chest pain type (cp)
      <select name="cp">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </label>

    <label>Resting blood pressure
      <input name="trestbps" type="number" value="120" required>
    </label>

    <label>Cholesterol
      <input name="chol" type="number" value="200" required>
    </label>

    <label>Fasting blood sugar (fbs)
      <select name="fbs">
        <option value="0" selected>0</option>
        <option value="1">1</option>
      </select>
    </label>

    <label>Resting ECG (restecg)
      <select name="restecg">
        <option value="0" selected>0</option>
        <option value="1">1</option>
        <option value="2">2</option>
      </select>
    </label>

    <label>Maximum heart rate (thalach)
      <input name="thalach" type="number" value="150" required>
    </label>

    <label>Exercise-induced angina (exang)
      <select name="exang">
        <option value="0" selected>No (0)</option>
        <option value="1">Yes (1)</option>
      </select>
    </label>

    <label>ST depression (oldpeak)
      <input name="oldpeak" type="number" step="0.1" value="1.0" required>
    </label>

    <label>Slope
      <select name="slope">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
      </select>
    </label>

    <label>Major vessels (ca)
      <select name="ca">
        <option value="0" selected>0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </label>

    <label>Thal
      <select name="thal">
        <option value="3" selected>3</option>
        <option value="6">6</option>
        <option value="7">7</option>
      </select>
    </label>

    <button type="submit">Predict</button>
  </form>

  <div id="result" role="status">
    The prediction will appear here.
  </div>

  <script>
    document.getElementById("predictionForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("result").textContent =
        "The form is working, but the trained model has not been connected yet.\n\n" +
        "This website does not make a real machine learning prediction yet. " +
        "We will connect the model in the next step.";
    });
  </script>
</body>
</html>
